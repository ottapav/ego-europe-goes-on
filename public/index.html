<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EGO – Europe Goes On</title>
  <meta name="description" content="An async multiplayer strategy game: govern an EU state, choose between national ego and European cooperation.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&subset=latin,latin-ext&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231A1F36'/><circle cx='16' cy='16' r='7' fill='none' stroke='%23E8B634' stroke-width='3'/></svg>">
</head>
<body>
  <header class="masthead">
    <div class="wordmark">
      <h1>EGO</h1>
      <p id="tagline">Europe goes on<span class="q">?</span></p>
    </div>
    <div class="head-right">
      <div class="lang" id="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="false" lang="en">EN</button>
        <button data-lang="cs" aria-pressed="false" lang="cs">CS</button>
      </div>
      <div class="clock" id="clock" aria-live="polite"></div>
    </div>
  </header>

  <main id="app">
    <p class="loading">Loading the Union…</p>
  </main>

  <footer class="foot">
    <p id="footer">EGO is an educational prototype. Game values are abstractions; real-world figures are labelled with their source year.</p>
  </footer>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
